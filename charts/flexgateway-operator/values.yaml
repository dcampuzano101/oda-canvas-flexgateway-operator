replicaCount: 1

image:
  repository: "akumartmf/apioperatorflexgateway"          # e.g. docker.io/yourorg/flexgateway-operator
  tag: "v0.11"
  pullPolicy: IfNotPresent

# Anypoint credentials — stored in a K8s Secret
anypointSecret:
  name: flexgateway-anypoint-creds
  clientId: "eea....................."
  clientSecret: "477....................."

# Operator configuration — all values required, set per deployment
operator:
  anypointOrgId: "0b2ebc55...................." 
  anypointEnvId: "cbc85e......................"
  anypointHost: "anypoint.mulesoft.com"        # anypoint.mulesoft.com | eu1.anypoint.mulesoft.com | ca1.anypoint.mulesoft.com | jp1.anypoint.mulesoft.com
  flexGwTargetId: "3e81818....................."      # CloudHub 2.0 Private Space target ID
  flexGwName: "oda-canvas-local-gw"          # Name of the pre-provisioned Managed Flex Gateway
  keycloakJwksUrl: "<host.name>:8083/auth/realms/odari/protocol/openid-connect/certs"     # Canvas Keycloak JWKS endpoint
  keycloakAudience: "oda-canvas-gateway"    # JWT aud claim value
  logging: "INFO"
  istioIngressHost: ""    # Override Istio discovery for local testing — leave empty in production
  istioSecretName: "istio-ingress-cert"    # Optional: name of K8s Secret containing TLS certs for Istio ingress
  istioSecretNamespace: "istio-ingress"   # Namespace of the above Secret
  gatewayTlsSecretName: "flexgateway-canvas-tls"  # Optional: name of Anypoint Secret containing TLS certs for the gateway — required if the operator manages TLS for the gateway

# Policy templates — define which policies to apply per apiType.
# Edit these values or patch the ConfigMap directly after deployment.
# If the ConfigMap is deleted, the operator falls back to built-in defaults.
policyTemplates:
  mcp:
    - assetId: jwt-validation
      minorVersion: "0.11"
    - assetId: tracing
      minorVersion: "1.1"
    - assetId: header-injection
      minorVersion: "1.3"
    - assetId: mcp-support
      minorVersion: "1.0"
    - assetId: agent-connection-telemetry
      minorVersion: "1.0"
  a2a:
    - assetId: jwt-validation
      minorVersion: "0.11"
    - assetId: tracing
      minorVersion: "1.1"
    - assetId: header-injection
      minorVersion: "1.3"
    - assetId: a-two-a-agent-card
      minorVersion: "1.0"
    - assetId: agent-connection-telemetry
      minorVersion: "1.0"
  openapi:
    - assetId: rate-limiting
      minorVersion: "1.4"
      condition: rateLimit.enabled
    - assetId: cors
      minorVersion: "1.0"
      condition: CORS.enabled
    - assetId: jwt-validation
      minorVersion: "0.11"
    - assetId: tracing
      minorVersion: "1.1"
    - assetId: header-injection
      minorVersion: "1.3"
