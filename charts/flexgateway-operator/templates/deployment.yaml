apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-flexgateway-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-flexgateway-operator
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-flexgateway-operator
    spec:
      serviceAccountName: {{ .Release.Name }}-flexgateway-operator-sa
      containers:
        - name: flexgateway-operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ANYPOINT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anypointSecret.name }}
                  key: ANYPOINT_CLIENT_ID
            - name: ANYPOINT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anypointSecret.name }}
                  key: ANYPOINT_CLIENT_SECRET
            - name: ANYPOINT_ORG_ID
              value: {{ .Values.operator.anypointOrgId | quote }}
            - name: ANYPOINT_ENV_ID
              value: {{ .Values.operator.anypointEnvId | quote }}
            - name: ANYPOINT_HOST
              value: {{ .Values.operator.anypointHost | quote }}
            - name: FLEX_GW_TARGET_ID
              value: {{ .Values.operator.flexGwTargetId | quote }}
            - name: FLEX_GW_NAME
              value: {{ .Values.operator.flexGwName | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.operator.keycloakJwksUrl | quote }}
            - name: KEYCLOAK_AUDIENCE
              value: {{ .Values.operator.keycloakAudience | quote }}
            - name: ISTIO_INGRESS_HOST
              value: {{ .Values.operator.istioIngressHost | quote }}
            - name: UPSTREAM_TLS_MODE
              value: {{ .Values.operator.upstreamTlsMode | quote }}
            - name: ISTIO_CERT_PATH
              value: {{ .Values.operator.istioCertPath | quote }}
            - name: UPSTREAM_TLS_SECRET_GROUP
              value: {{ .Values.operator.upstreamTlsSecretGroup | quote }}
            - name: OPERATOR_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: VERIFY_UPSTREAM_TLS
              value: {{ .Values.operator.verifyUpstreamTls | quote }}
            - name: LOGGING
              value: {{ .Values.operator.logging | quote }}
          volumeMounts:
            - name: istio-ingress-cert
              mountPath: /etc/istio-certs
              readOnly: true
      volumes:
        - name: istio-ingress-cert
          secret:
            secretName: istio-ingress-cert
